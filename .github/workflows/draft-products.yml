name: Draft product suggestion

on:
  schedule:
    # Weekly: Sunday at 12:00 UTC
    - cron: "0 12 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Draft a product suggestion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run draft-product

      - name: Commit and push
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add content/products-pending.json
          git diff --staged --quiet || git commit -m "Add pending product suggestion for review"
          git push